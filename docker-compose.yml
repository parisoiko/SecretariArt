# The app and a SQL Server, for trying a production-like set-up on one machine:
#   SA_PASSWORD='Choose-a-strong-one1' ADMIN_PASSWORD='Another-strong-one1' docker compose up --build
# Then open http://localhost:8080 and sign in as admin@secretariart.local. No demo data outside Development.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql

  app:
    build: .
    depends_on: [db]
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__SecretariArt: "Server=db;Database=SecretariArt;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      PlatformAdmin__Email: admin@secretariart.local
      PlatformAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      PlatformAdmin__FirstName: Platform
      PlatformAdmin__LastName: Admin
      Email__PublicUrl: http://localhost:8080
    volumes:
      - keys:/data/keys
      - mail:/app/App_Data
    # SQL Server takes a few seconds to accept connections on first start; the app retries by restarting.
    restart: on-failure

volumes:
  sqldata:
  keys:
  mail:
