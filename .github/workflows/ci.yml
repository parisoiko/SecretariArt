name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore SecretariArt.slnx

      - name: Build
        run: dotnet build SecretariArt.slnx --no-restore -c Release

      # Unit tests + integration tests (in-memory SQLite, so no SQL Server is needed)
      - name: Test
        run: dotnet test SecretariArt.slnx --no-build -c Release --verbosity normal

  # The container image builds (Dockerfile); it isn't pushed anywhere.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t secretariart:ci .
